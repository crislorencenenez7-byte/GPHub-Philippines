name: Scheduled Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check update-1.4
        run: |
          git fetch origin update-1.4

          echo "=== update.json from update-1.4 ==="
          git show origin/update-1.4:update.json

          echo "=== Branch information ==="
          git branch -a

          echo "Release branch: update-1.4"
          echo "Target: main"

      - name: Test completed
        run: |
          echo "Release test completed successfully."
          echo "NO MERGE PERFORMED."
