name: Scheduled Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Read scheduled update
        run: |
          git fetch origin update-1.4

          git show origin/update-1.4:update.json > /tmp/update.json

          VERSION=$(jq -r '.version' /tmp/update.json)
          UPDATE_NAME=$(jq -r '.updateName' /tmp/update.json)

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "UPDATE_NAME=$UPDATE_NAME" >> "$GITHUB_ENV"

          echo "================================="
          echo "Starting scheduled release..."
          echo "================================="
          echo "Releasing version: $VERSION"
          echo "Update: $UPDATE_NAME"

      - name: Update version.json
        run: |
          jq \
            --arg version "$VERSION" \
            --arg updateName "$UPDATE_NAME" \
            '.version = $version | .updateName = $updateName | .status = "released"' \
            version.json > version.tmp.json

          mv version.tmp.json version.json

      - name: Commit release
        run: |
          git add version.json

          if git diff --cached --quiet; then
            echo "No version.json changes to commit."
          else
            git commit -m "Release version $VERSION"
          fi

      - name: Push release
        run: |
          git push origin main
