name: Scheduled Update

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check release schedule
        id: check
        run: |
          python <<'PY'
          import json
          from datetime import datetime, timezone

          with open("update.json") as f:
              data = json.load(f)

          release = datetime.fromisoformat(
              data["releaseDate"] + "T" + data["releaseTime"] + ":00+08:00"
          )

          now = datetime.now(timezone.utc)

          print("Release time:", release)
          print("Current time:", now)

          if now >= release:
              print("RELEASE_READY=true")
          else:
              print("RELEASE_READY=false")
          PY

      - name: Release update
        run: |
          python <<'PY'
          import json
          from datetime import datetime, timezone

          with open("update.json") as f:
              data = json.load(f)

          release = datetime.fromisoformat(
              data["releaseDate"] + "T" + data["releaseTime"] + ":00+08:00"
          )

          now = datetime.now(timezone.utc)

          if now >= release:
              with open("auto-update.txt", "w") as f:
                  f.write(f"UPDATE {data['version']} IS NOW LIVE!\n")
                  f.write(f"{data['updateName']}\n")
                  f.write(f"Released: {data['releaseDate']} {data['releaseTime']} PH")
          else:
              print("Not yet time for the update.")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auto-update.txt
          git commit -m "Automatic scheduled update" || echo "No changes to commit"
          git push
