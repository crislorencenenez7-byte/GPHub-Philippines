name: Scheduled Update

on:
  schedule:
    - cron: "17,27,37,47,57 * * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Automatic schedule test
        run: |
          echo "Automatic scheduled run: $(date -u)" > schedule-test.txt

      - name: Commit test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule-test.txt
          git diff --cached --quiet || git commit -m "Test automatic schedule"
          git push
