name: Scheduled Release

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

  repository_dispatch:
    types:
      - schedule-release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check release time
        id: release
        shell: bash
        run: |
          set -e

          git fetch origin main update-1.4

          python - <<'PY'
          import json
          import subprocess
          from datetime import datetime, timezone

          raw = subprocess.check_output(
              ["git", "show", "origin/update-1.4:update.json"],
              text=True
          )

          data = json.loads(raw)

          release_date = data["releaseDate"]
          release_time = data["releaseTime"]

          hour, minute = map(int, release_time.split(":"))

          release_dt = datetime.fromisoformat(
              f"{release_date}T{hour:02d}:{minute:02d}:00+08:00"
          )

          now = datetime.now(timezone.utc)

          print("=================================")
          print("SCHEDULED RELEASE CHECK")
          print("=================================")
          print("Current UTC :", now.isoformat())
          print("Release PH  :", release_dt.isoformat())
          print("Version     :", data.get("version", ""))
          print("Update      :", data.get("updateName", ""))
          print("=================================")

          ready = now >= release_dt

          print(
              "RELEASE READY"
              if ready
              else "NOT YET RELEASED"
          )

          with open(
              "/tmp/release-ready",
              "w"
          ) as f:
              f.write("yes" if ready else "no")
          PY

          echo "ready=$(cat /tmp/release-ready)" >> "$GITHUB_OUTPUT"

      - name: Release update-1.4 to main
        if: steps.release.outputs.ready == 'yes'
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main update-1.4

          git checkout main
          git reset --hard origin/main

          echo "Copying update-1.4 into main..."

          git archive origin/update-1.4 \
            | tar -x

          # update.json is only the scheduler's control file.
          # Do NOT keep it in main.
          rm -f update.json

          echo "================================="
          echo "CHANGES TO BE RELEASED"
          echo "================================="

          git status --short

          git add -A

          if git diff --cached --quiet; then
            echo "No new changes to release."
          else
            git commit -m "Release scheduled update"
            git push origin main
            echo "RELEASE SUCCESSFUL"
          fi

      - name: Wait for scheduled release
        if: steps.release.outputs.ready == 'no'
        run: |
          echo "Update is not ready yet."
          echo "The next scheduled run will check again."      #
      # update.json
      #
      # update.json stays only on update-1.4.
      # =========================================================

      - name: Release update-1.4 to main
        if: steps.release.outputs.ready == 'yes'
        shell: bash
        run: |

          set -e

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main update-1.4

          echo "================================="
          echo "Preparing release..."
          echo "================================="

          # Make sure we are on main.

          git checkout main

          # Reset working tree before copying files.

          git reset --hard origin/main

          # Copy the complete update-1.4 tree.
          #
          # update.json is intentionally excluded.

          git archive origin/update-1.4 \
            | tar -x \
                --exclude=update.json

          # Remove update.json if it somehow exists
          # in the extracted tree.

          rm -f update.json

          echo "================================="
          echo "Files prepared for main:"
          echo "================================="

          git status --short

          # Stage all changes.

          git add -A

          # Nothing changed = no commit required.

          if git diff --cached --quiet; then

            echo "No files changed."
            echo "Release already applied."

          else

            git commit \
              -m "Release scheduled update"

            git push origin main

            echo "================================="
            echo "RELEASE SUCCESSFUL"
            echo "================================="

          fi


      # =========================================================
      # NOT READY
      # =========================================================

      - name: Wait for scheduled release
        if: steps.release.outputs.ready == 'no'
        run: |

          echo "================================="
          echo "Update is not ready yet."
          echo "================================="
          echo "The workflow will check again."
          echo "Schedule: every 5 minutes."
