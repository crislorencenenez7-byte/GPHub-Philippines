name: Scheduled Update

on:
  schedule:
    - cron: "25 2 12 8 *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read update information
        id: update
        run: |
          VERSION=$(python -c "import json; print(json.load(open('update.json'))['version'])")
          NAME=$(python -c "import json; print(json.load(open('update.json'))['updateName'])")

          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "NAME=$NAME" >> "$GITHUB_OUTPUT"

      - name: Create update file
        run: |
          echo "UPDATE ${{ steps.update.outputs.VERSION }} IS NOW LIVE!" > auto-update.txt
          echo "${{ steps.update.outputs.NAME }}" >> auto-update.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auto-update.txt
          git commit -m "Release ${{ steps.update.outputs.VERSION }}" || echo "No changes to commit"
          git push
