name: Scheduled Release

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [scheduled-release]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Read scheduled update
        id: update
        run: |
          git fetch origin update-1.4

          git show origin/update-1.4:update.json > /tmp/update.json

          VERSION=$(jq -r '.version' /tmp/update.json)
          UPDATE_NAME=$(jq -r '.updateName' /tmp/update.json)
          RELEASE_DATE=$(jq -r '.releaseDate' /tmp/update.json)
          RELEASE_TIME=$(jq -r '.releaseTime' /tmp/update.json)

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "UPDATE_NAME=$UPDATE_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_DATE=$RELEASE_DATE" >> "$GITHUB_ENV"
          echo "RELEASE_TIME=$RELEASE_TIME" >> "$GITHUB_ENV"

          echo "================================="
          echo "Scheduled Release"
          echo "================================="
          echo "Version: $VERSION"
          echo "Update: $UPDATE_NAME"
          echo "Release: $RELEASE_DATE $RELEASE_TIME PH"

      - name: Check release time
        id: release
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone

          release_time = datetime.fromisoformat(
              os.environ["RELEASE_DATE"]
              + "T"
              + os.environ["RELEASE_TIME"]
              + ":00+08:00"
          )

          now = datetime.now(timezone.utc)

          print("Current UTC:", now)
          print("Release time:", release_time)

          if now >= release_time:
              print("RELEASE READY")
              with open("/tmp/release-ready", "w") as f:
                  f.write("yes")
          else:
              print("NOT YET RELEASED")
              with open("/tmp/release-ready", "w") as f:
                  f.write("no")
          PY

          echo "ready=$(cat /tmp/release-ready)" >> "$GITHUB_OUTPUT"

      - name: Release update-1.4 to main
        if: steps.release.outputs.ready == 'yes'
        run: |
          echo "================================="
          echo "Releasing version $VERSION"
          echo "================================="

          git fetch origin main update-1.4

          # Always start from the latest main.
          git checkout main
          git reset --hard origin/main

          # Copy the complete update branch into main.
          # update.json is intentionally excluded because
          # it belongs only to the staging/release branch.
          git checkout origin/update-1.4 -- .

          # Never place the staging update.json in main.
          git rm -f --ignore-unmatch update.json

          # Update version.json on main.
          jq \
            --arg version "$VERSION" \
            --arg updateName "$UPDATE_NAME" \
            '.version = $version
             | .updateName = $updateName
             | .status = "released"' \
            version.json > version.tmp.json

          mv version.tmp.json version.json

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to release."
          else
            git commit -m "Release version $VERSION"
            git push origin main
          fi

      - name: Wait for scheduled release
        if: steps.release.outputs.ready == 'no'
        run: |
          echo "Update is not ready yet."
          echo "Next check will run within 5 minutes."
