name: Scheduled Update

on:
  schedule:
    - cron: "25 2 12 8 *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update file
        run: |
          echo "UPDATE 1.5 IS NOW LIVE!" > auto-update.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auto-update.txt
          git commit -m "Release Update 1.5" || echo "No changes to commit"
          git push
