name: Scheduled Release

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [scheduled-release]

permissions:
  contents: write

concurrency:
  group: scheduled-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch branches
        run: |
          git fetch origin main update-1.4 --prune

      - name: Check release time
        id: release
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY' > /tmp/release-output
          import json
          import subprocess
          import sys
          from datetime import datetime, timezone

          raw = subprocess.check_output(
              ["git", "show", "origin/update-1.4:update.json"],
              text=True
          )

          data = json.loads(raw)

          version = str(data["version"])

          release_time = datetime.fromisoformat(
              data["releaseDate"]
              + "T"
              + data["releaseTime"]
              + ":00+08:00"
          )

          now = datetime.now(timezone.utc)

          ready = now >= release_time

          # ONLY GitHub Actions output values go to stdout.
          print(f"version={version}")
          print(f"ready={'yes' if ready else 'no'}")

          # Diagnostic information goes to stderr.
          print("====================================", file=sys.stderr)
          print("CURRENT UTC:", now, file=sys.stderr)
          print("RELEASE TIME:", release_time, file=sys.stderr)
          print("VERSION:", version, file=sys.stderr)
          print("READY:", ready, file=sys.stderr)
          print("====================================", file=sys.stderr)
          PY

          cat /tmp/release-output >> "$GITHUB_OUTPUT"

          echo "===================================="
          cat /tmp/release-output
          echo "===================================="

      - name: Release update-1.4 into main
        if: steps.release.outputs.ready == 'yes'
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.release.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "===================================="
          echo "PREPARING RELEASE"
          echo "VERSION: $VERSION"
          echo "===================================="

          git checkout -B main origin/main

          # Check already released version
          CURRENT_VERSION=""

          if git show origin/main:version.json > /tmp/current-version.json 2>/dev/null; then
            CURRENT_VERSION=$(python - <<'PY'
          import json

          try:
              with open("/tmp/current-version.json") as f:
                  data = json.load(f)

              print(data.get("version", ""))
          except Exception:
              print("")
          PY
            )
          fi

          echo "Current main version: ${CURRENT_VERSION:-none}"
          echo "Scheduled version: $VERSION"

          # Prevent duplicate release
          if [ "$CURRENT_VERSION" = "$VERSION" ]; then
            echo "Version $VERSION is already released."
            echo "Nothing to do."
            exit 0
          fi

          echo "===================================="
          echo "MERGING ALL update-1.4 CHANGES"
          echo "===================================="

          set +e

          git merge origin/update-1.4 \
            --no-edit \
            -X theirs \
            -m "Release v$VERSION"

          MERGE_STATUS=$?

          set -e

          # ------------------------------------------------
          # update.json conflict
          # ------------------------------------------------
          #
          # main deleted update.json
          # update-1.4 modified update.json
          #
          # Final main MUST NOT contain update.json.
          #

          if git ls-files -u -- update.json | grep -q .; then
            echo "Resolving update.json conflict..."

            git rm -f -- update.json

            echo "update.json removed."
          fi

          # ------------------------------------------------
          # Resolve other conflicts
          # ------------------------------------------------

          CONFLICTS=$(git diff --name-only --diff-filter=U || true)

          if [ -n "$CONFLICTS" ]; then

            echo "Remaining conflicts:"
            echo "$CONFLICTS"

            while IFS= read -r FILE; do

              [ -z "$FILE" ] && continue

              if [ "$FILE" = "update.json" ]; then
                continue
              fi

              echo "Using update-1.4 version: $FILE"

              git checkout --theirs -- "$FILE"
              git add -- "$FILE"

            done <<< "$CONFLICTS"

          fi

          # ------------------------------------------------
          # Final conflict check
          # ------------------------------------------------

          if git diff --name-only --diff-filter=U | grep -q .; then

            echo "===================================="
            echo "ERROR: UNRESOLVED CONFLICTS"
            echo "===================================="

            git diff --name-only --diff-filter=U

            exit 1
          fi

          # ------------------------------------------------
          # Finish merge
          # ------------------------------------------------

          if [ "$MERGE_STATUS" -ne 0 ]; then
            git commit -m "Release v$VERSION"
          fi

          # ------------------------------------------------
          # Make absolutely sure update.json is removed
          # ------------------------------------------------

          if git ls-files --error-unmatch update.json >/dev/null 2>&1; then

            echo "Removing update.json from main..."

            git rm -f -- update.json

            git commit -m "Remove update.json after release v$VERSION"

          fi

          # ------------------------------------------------
          # Create version.json
          # ------------------------------------------------

          RELEASED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > version.json <<EOF
          {
            "version": "$VERSION",
            "releasedAt": "$RELEASED_AT"
          }
          EOF

          git add version.json

          git commit -m "Set version.json for v$VERSION"

          # ------------------------------------------------
          # Push complete release
          # ------------------------------------------------

          echo "===================================="
          echo "PUSHING COMPLETE RELEASE"
          echo "===================================="

          git push origin HEAD:main

          echo "===================================="
          echo "UPDATE v$VERSION RELEASED SUCCESSFULLY"
          echo "===================================="
          echo "ALL update-1.4 CHANGES -> main"
          echo "update.json -> REMOVED"
          echo "version.json -> CREATED"
          echo "===================================="

      - name: Wait for scheduled release
        if: steps.release.outputs.ready == 'no'
        run: |
          echo "===================================="
          echo "UPDATE NOT READY YET"
          echo "===================================="
          echo "Next scheduled check will try again."
