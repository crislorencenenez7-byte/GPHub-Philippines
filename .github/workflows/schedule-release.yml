name: Scheduled Release

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch update branch
        run: |
          git fetch origin main update-1.4 --prune

      - name: Check release time
        id: release
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from datetime import datetime, timezone

          raw = subprocess.check_output(
              ["git", "show", "origin/update-1.4:update.json"],
              text=True
          )

          data = json.loads(raw)

          version = str(data["version"])

          release_time = datetime.fromisoformat(
              data["releaseDate"] + "T" +
              data["releaseTime"] + ":00+08:00"
          )

          now = datetime.now(timezone.utc)

          print("Current UTC:", now)
          print("Release time:", release_time)
          print("Version:", version)

          with open("/tmp/release-ready", "w") as f:
              f.write("yes" if now >= release_time else "no")

          with open("/tmp/version", "w") as f:
              f.write(version)

          print(
              "RELEASE READY"
              if now >= release_time
              else
              "NOT YET RELEASED"
          )
          PY

          echo "ready=$(cat /tmp/release-ready)" >> "$GITHUB_OUTPUT"
          echo "version=$(cat /tmp/version)" >> "$GITHUB_OUTPUT"

      - name: Release update-1.4 into main
        if: steps.release.outputs.ready == 'yes'
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.release.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Check if this version was already released.
          CURRENT_VERSION=""

          if git show origin/main:version.json > /tmp/current-version.json 2>/dev/null; then
            CURRENT_VERSION=$(python - <<'PY'
          import json

          try:
              with open("/tmp/current-version.json") as f:
                  print(json.load(f).get("version", ""))
          except Exception:
              print("")
          PY
            )
          fi

          if [ "$CURRENT_VERSION" = "$VERSION" ]; then
            echo "Version $VERSION is already released."
            echo "Nothing to do."
            exit 0
          fi

          git checkout -B main origin/main

          echo "===================================="
          echo "Merging ALL update-1.4 changes..."
          echo "Version: $VERSION"
          echo "===================================="

          # Merge the COMPLETE update-1.4 branch.
          # -X theirs prefers update-1.4 when a file has a merge conflict.
          if ! git merge origin/update-1.4 \
              --no-edit \
              -X theirs \
              -m "Release v$VERSION"; then

            echo "ERROR: Merge failed."
            echo "Unresolved conflicts:"

            git diff --name-only --diff-filter=U || true

            exit 1
          fi

          # update.json is only the scheduler input.
          # Never leave it in main.
          if git ls-files --error-unmatch update.json >/dev/null 2>&1; then
            git rm -f update.json
            git commit -m "Remove update.json after release v$VERSION"
          fi

          # Create permanent version.json in main.
          RELEASED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > version.json <<EOF
          {
            "version": "$VERSION",
            "releasedAt": "$RELEASED_AT"
          }
          EOF

          git add version.json
          git commit -m "Set version.json for v$VERSION"

          # Push EVERYTHING merged from update-1.4 into main.
          git push origin HEAD:main

          echo "===================================="
          echo "UPDATE $VERSION RELEASED SUCCESSFULLY"
          echo "ALL update-1.4 CHANGES ARE NOW IN main"
          echo "===================================="

      - name: Wait for scheduled release
        if: steps.release.outputs.ready == 'no'
        run: |
          echo "Update is not ready yet."
          echo "Next scheduled check will try again."
