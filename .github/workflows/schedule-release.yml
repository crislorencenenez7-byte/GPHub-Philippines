name: Scheduled Release

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check release time
        id: release
        run: |
          set -e

          git fetch origin update-1.4

          python - <<'PY'
          import json
          import subprocess
          from datetime import datetime, timezone

          raw = subprocess.check_output(
              ["git", "show", "origin/update-1.4:update.json"],
              text=True
          )

          data = json.loads(raw)

          release_time = datetime.fromisoformat(
              data["releaseDate"] + "T" +
              data["releaseTime"] + ":00+08:00"
          )

          now = datetime.now(timezone.utc)

          print("Current UTC:", now)
          print("Release time:", release_time)
          print("Version:", data["version"])
          print("Update:", data["updateName"])

          if now >= release_time:
              with open("/tmp/release-ready", "w") as f:
                  f.write("yes")

              print("RELEASE READY")
          else:
              with open("/tmp/release-ready", "w") as f:
                  f.write("no")

              print("NOT YET RELEASED")
          PY

          echo "ready=$(cat /tmp/release-ready)" >> "$GITHUB_OUTPUT"

      - name: Merge update-1.4 into main
        if: steps.release.outputs.ready == 'yes'
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin

          git checkout main
          git reset --hard origin/main

          echo "Starting scheduled release..."

          # Get release information before the merge.
          git show origin/update-1.4:update.json > /tmp/update.json

          VERSION=$(python -c "import json; print(json.load(open('/tmp/update.json'))['version'])")
          UPDATE_NAME=$(python -c "import json; print(json.load(open('/tmp/update.json'))['updateName'])")

          echo "Releasing version: $VERSION"
          echo "Update: $UPDATE_NAME"

          # Try normal merge first.
          if git merge origin/update-1.4 --no-edit; then
            echo "Merge completed without conflicts."
          else
            echo "Merge conflict detected."

            # The only expected conflict is update.json.
            if git ls-files -u | grep -q "update.json"; then
              echo "Resolving update.json conflict."

              # update.json belongs to the release branch only.
              # Keep it deleted from main.
              git rm -f update.json

              git add -A

              git commit -m "Release $VERSION"
            else
              echo "Unexpected merge conflict detected."
              git merge --abort
              exit 1
            fi
          fi

          # Make sure update.json never remains in main.
          if [ -f update.json ]; then
            git rm -f update.json

            if ! git diff --cached --quiet; then
              git commit -m "Remove release metadata from main"
            fi
          fi

          # Create/update version.json in main.
          cat > version.json <<EOF
          {
            "version": "$VERSION",
            "updateName": "$UPDATE_NAME",
            "releasedAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

          git add version.json

          if git diff --cached --quiet; then
            echo "version.json is already up to date."
          else
            git commit -m "Update live version to $VERSION"
          fi

          git push origin main

          echo "================================="
          echo "SCHEDULED RELEASE SUCCESSFUL"
          echo "Version: $VERSION"
          echo "================================="

      - name: Wait for release time
        if: steps.release.outputs.ready == 'no'
        run: |
          echo "Update is not ready yet."
          echo "Next scheduled check will try again."
