name: Release Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check update branch
        run: |
          git fetch origin update-1.4
          git show origin/update-1.4:update.json

      - name: Test release information
        run: |
          echo "Release branch: update-1.4"
          echo "Target release: 1:10 PM PH"
          echo "No merge performed."
