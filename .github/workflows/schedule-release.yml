name: Scheduled Update

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check and release update
        run: |
          python <<'PY'
          import json
          from datetime import datetime, timezone

          with open("update.json", "r") as f:
              data = json.load(f)

          release_time = datetime.fromisoformat(
              data["releaseDate"] + "T" +
              data["releaseTime"] + ":00+08:00"
          )

          now = datetime.now(timezone.utc)

          print("Current UTC:", now)
          print("Release time:", release_time)

          if now >= release_time:
              with open("auto-update.txt", "w") as f:
                  f.write(
                      f"UPDATE {data['version']} IS NOW LIVE!\n"
                      f"{data['updateName']}\n"
                      f"Released: {data['releaseDate']} "
                      f"{data['releaseTime']} PH\n"
                  )

              print("UPDATE RELEASED!")
          else:
              print("UPDATE NOT YET RELEASED.")
          PY

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add auto-update.txt

          git diff --cached --quiet || \
            git commit -m "Release scheduled update"

          git push
