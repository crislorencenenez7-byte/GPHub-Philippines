name: Scheduled Release

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch branches
        run: |
          git fetch origin main update-1.4 --prune

      - name: Check release time
        id: release
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import subprocess
          from datetime import datetime, timezone

          raw = subprocess.check_output(
              ["git", "show", "origin/update-1.4:update.json"],
              text=True
          )

          data = json.loads(raw)

          version = str(data["version"])

          release_time = datetime.fromisoformat(
              data["releaseDate"] + "T" +
              data["releaseTime"] + ":00+08:00"
          )

          now = datetime.now(timezone.utc)

          print("====================================")
          print("CURRENT UTC:", now)
          print("RELEASE TIME:", release_time)
          print("VERSION:", version)
          print("====================================")

          ready = now >= release_time

          with open("$GITHUB_OUTPUT", "a") as out:
              out.write(f"ready={'yes' if ready else 'no'}\n")
              out.write(f"version={version}\n")

          if ready:
              print("RELEASE READY")
          else:
              print("NOT YET RELEASED")
          PY

      - name: Release update-1.4 into main
        if: steps.release.outputs.ready == 'yes'
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.release.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "===================================="
          echo "PREPARING RELEASE"
          echo "VERSION: $VERSION"
          echo "===================================="

          # Make sure main is current.
          git checkout -B main origin/main

          # Check current released version.
          CURRENT_VERSION=""

          if git show origin/main:version.json > /tmp/version.json 2>/dev/null; then
            CURRENT_VERSION=$(python - <<'PY'
          import json

          try:
              with open("/tmp/version.json") as f:
                  data = json.load(f)

              print(data.get("version", ""))
          except Exception:
              print("")
          PY
            )
          fi

          echo "Current main version: ${CURRENT_VERSION:-none}"
          echo "Scheduled version: $VERSION"

          # Prevent duplicate releases.
          if [ "$CURRENT_VERSION" = "$VERSION" ]; then
            echo "===================================="
            echo "VERSION $VERSION ALREADY RELEASED"
            echo "NOTHING TO DO"
            echo "===================================="
            exit 0
          fi

          echo "===================================="
          echo "MERGING ALL update-1.4 CHANGES"
          echo "===================================="

          # Try complete merge.
          if git merge origin/update-1.4 \
              --no-edit \
              -X theirs \
              -m "Release v$VERSION"; then

            echo "Merge completed without conflicts."

          else

            echo "===================================="
            echo "MERGE CONFLICT DETECTED"
            echo "===================================="

            # ------------------------------------------------
            # update.json special case
            # ------------------------------------------------
            #
            # main deleted update.json
            # update-1.4 modified update.json
            #
            # Final main must NOT contain update.json.
            #

            if git ls-files -u -- update.json | grep -q .; then
              echo "Resolving update.json..."

              git rm -f update.json

              echo "update.json deleted successfully."
            fi

            # ------------------------------------------------
            # Resolve remaining conflicts
            # ------------------------------------------------
            #

            CONFLICTS=$(git diff --name-only --diff-filter=U || true)

            if [ -n "$CONFLICTS" ]; then
              echo "Remaining conflicts:"
              echo "$CONFLICTS"

              # For every remaining conflict,
              # prefer update-1.4 version.
              while IFS= read -r FILE; do

                [ -z "$FILE" ] && continue

                if [ "$FILE" = "update.json" ]; then
                  continue
                fi

                echo "Resolving using update-1.4: $FILE"

                git checkout --theirs -- "$FILE"
                git add "$FILE"

              done <<< "$CONFLICTS"
            fi

            # ------------------------------------------------
            # Final conflict check
            # ------------------------------------------------
            #

            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "===================================="
              echo "ERROR: UNRESOLVED CONFLICTS REMAIN"
              echo "===================================="

              git diff --name-only --diff-filter=U

              exit 1
            fi

            # Complete the merge.
            git commit -m "Release v$VERSION"

            echo "Merge conflicts resolved."
          fi

          # ------------------------------------------------
          # Absolutely make sure update.json is removed.
          # ------------------------------------------------
          #

          if [ -f update.json ]; then
            echo "Removing update.json from main..."

            git rm -f update.json

            git commit -m "Remove update.json after release v$VERSION"
          fi

          # ------------------------------------------------
          # Create version.json
          # ------------------------------------------------
          #

          RELEASED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > version.json <<EOF
          {
            "version": "$VERSION",
            "releasedAt": "$RELEASED_AT"
          }
          EOF

          git add version.json

          git commit -m "Set version.json for v$VERSION"

          # ------------------------------------------------
          # Push COMPLETE release to main.
          # ------------------------------------------------
          #

          echo "===================================="
          echo "PUSHING RELEASE TO MAIN"
          echo "===================================="

          git push origin HEAD:main

          echo "===================================="
          echo "UPDATE $VERSION RELEASED SUCCESSFULLY"
          echo "===================================="
          echo "ALL update-1.4 CHANGES ARE NOW IN main"
          echo "update.json REMOVED FROM main"
          echo "version.json CREATED"
          echo "===================================="

      - name: Wait for scheduled release
        if: steps.release.outputs.ready == 'no'
        run: |
          echo "===================================="
          echo "UPDATE NOT READY YET"
          echo "===================================="
          echo "The workflow will check again on the next run."
