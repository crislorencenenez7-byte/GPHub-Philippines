name: Scheduled Release

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [scheduled-release]
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check release time
        id: release
        run: |
          git fetch origin update-1.4

          python - <<'PY'
          import json
          import subprocess
          from datetime import datetime, timezone

          raw = subprocess.check_output(
              ["git", "show", "origin/update-1.4:update.json"],
              text=True
          )

          data = json.loads(raw)

          release_time = datetime.fromisoformat(
              data["releaseDate"] + "T" +
              data["releaseTime"] + ":00+08:00"
          )

          now = datetime.now(timezone.utc)

          print("Current UTC:", now)
          print("Release time:", release_time)
          print("Version:", data["version"])

          if now >= release_time:
              with open("/tmp/release-ready", "w") as f:
                  f.write("yes")
              print("RELEASE READY")
          else:
              with open("/tmp/release-ready", "w") as f:
                  f.write("no")
              print("NOT YET RELEASED")
          PY

          echo "ready=$(cat /tmp/release-ready)" >> "$GITHUB_OUTPUT"

      - name: Merge update-1.4 into main
        if: steps.release.outputs.ready == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin

          git checkout main
          git merge origin/update-1.4 --no-edit

          git push origin main

      - name: Wait for scheduled release
        if: steps.release.outputs.ready == 'no'
        run: |
          echo "Update is not ready yet."
          echo "Next scheduled check will try again."
