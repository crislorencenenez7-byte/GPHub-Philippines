name: Scheduled Release

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

  repository_dispatch:
    types: [scheduled-release]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check release time
        id: release
        shell: bash
        run: |
          set -e

          git fetch origin update-1.4

          python - <<'PY'
          import json
          import subprocess
          from datetime import datetime, timezone

          raw = subprocess.check_output(
              ["git", "show", "origin/update-1.4:update.json"],
              text=True
          )

          data = json.loads(raw)

          release_time = datetime.fromisoformat(
              data["releaseDate"] + "T" +
              data["releaseTime"] + ":00+08:00"
          )

          now = datetime.now(timezone.utc)

          print("Current UTC:", now)
          print("Release time:", release_time)
          print("Version:", data["version"])
          print("Update:", data["updateName"])

          if now >= release_time:
              with open("/tmp/release-ready", "w") as f:
                  f.write("yes")
              print("RELEASE READY")
          else:
              with open("/tmp/release-ready", "w") as f:
                  f.write("no")
              print("NOT YET RELEASED")
          PY

          echo "ready=$(cat /tmp/release-ready)" >> "$GITHUB_OUTPUT"

      - name: Release update
        if: steps.release.outputs.ready == 'yes'
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin

          git checkout main
          git reset --hard origin/main

          echo "================================="
          echo "Starting scheduled release..."
          echo "================================="

          # Read release information from update branch.
          git show origin/update-1.4:update.json > /tmp/update.json

          VERSION=$(python -c "import json; print(json.load(open('/tmp/update.json'))['version'])")
          UPDATE_NAME=$(python -c "import json; print(json.load(open('/tmp/update.json'))['updateName'])")

          echo "Releasing version: $VERSION"
          echo "Update: $UPDATE_NAME"

          # ------------------------------------------------
          # Merge the release branch.
          #
          # version.json is intentionally taken from MAIN
          # during the merge because the workflow creates
          # the correct version.json below.
          # ------------------------------------------------

          git merge origin/update-1.4 \
            --no-edit \
            -X ours \
            --no-commit

          # Remove release-only metadata from main.
          if [ -f update.json ]; then
            git rm -f update.json
          fi

          # ------------------------------------------------
          # Create the live version.json.
          # ------------------------------------------------

          RELEASED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > version.json <<EOF
          {
            "version": "$VERSION",
            "updateName": "$UPDATE_NAME",
            "releasedAt": "$RELEASED_AT"
          }
          EOF

          git add -A

          # Commit everything together.
          git commit -m "Release $VERSION"

          # Push release to main.
          git push origin main

          echo "================================="
          echo "SCHEDULED RELEASE SUCCESSFUL"
          echo "Version: $VERSION"
          echo "Update: $UPDATE_NAME"
          echo "Released: $RELEASED_AT"
          echo "================================="

      - name: Wait for release time
        if: steps.release.outputs.ready == 'no'
        run: |
          echo "Update is not ready yet."
          echo "Next scheduled check will try again."
